<div 
    class="unit-toggle" 
    role="group" 
    aria-label="Temperature units">
    @for (o of options; track o.value) {
        <button
            type="button"
            [attr.aria-label]="o.aria"
            [attr.aria-pressed]="units() === o.value"
            (click)="changed.emit(o.value)"
        >{{ o.label }}</button>
    }
</div>
